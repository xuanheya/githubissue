[project]
name = "github-issue-advisor"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mini-swe-agent==2.4.6",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
